plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yebei199.btrearm'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.yebei199.btrearm"
        // connectGatt 的 TRANSPORT_LE 重载要 API 23;26 与 slint 的
        // android-activity 后端保持一致。
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            // ABI 由 cargo-ndk 放进 jniLibs 的目录决定,这里只是挡住野目录。
            //noinspection ChromeOsAbiSupport
            abiFilters = (project.findProperty('rearmAbis') ?: 'arm64-v8a').split(',')
        }
    }

    buildTypes {
        debug {
            // Rust 由 cargo-ndk 在 gradle 之前编好;debug APK 里装的是
            // release profile 的 .so(debug 的 slint+skia 体积大得离谱)。
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        // Shizuku 的用户服务是跨进程的,接口得用 aidl 描述。
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 借 Shizuku 的 shell 身份调用系统的连接接口 —— 该接口要 BLUETOOTH_PRIVILEGED
    // 与 MODIFY_PHONE_STATE,普通应用永远拿不到,而 shell 两个都有。
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
